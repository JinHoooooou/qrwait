spring:
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cookie-secure: false   # HTTPS 환경(prod)에서만 true로 오버라이드 — HTTP 로컬 개발에서는 Secure 쿠키가 저장/전송되지 않음

jwt:
  secret: ${JWT_SECRET}
  access-expiry: 3600            # 1시간 (초)
  refresh-idle-expiry: 604800    # 7일 (초) — 마지막 refresh 호출 기준 idle 만료
  refresh-absolute-expiry: 2592000 # 30일 (초) — 최초 로그인 기준 절대 만료 캡

sms:
  app-key: ${NHN_SMS_APP_KEY:}
  secret-key: ${NHN_SMS_SECRET_KEY:}
  sender: ${NHN_SMS_SENDER_NUMBER:}

privacy:
  phone-hash-secret: ${PHONE_HASH_SECRET}

logging:
  level:
    org.apache.catalina.core.ContainerBase: WARN
