spring:
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET}
  access-expiry: 3600      # 1시간 (초)
  refresh-expiry: 604800   # 7일 (초)

sms:
  app-key: ${NHN_SMS_APP_KEY:}
  secret-key: ${NHN_SMS_SECRET_KEY:}
  sender: ${NHN_SMS_SENDER_NUMBER:}

privacy:
  phone-hash-secret: ${PHONE_HASH_SECRET}

logging:
  level:
    org.apache.catalina.core.ContainerBase: WARN
