  # 로컬 개발: Flyway 가 스키마를 소유하고, Hibernate 는 엔티티↔스키마 일치만 검증한다.
  # 개발 시드는 로컬에서만 db/seed 를 추가로 로드해 적용한다.
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    hibernate:
      ddl-auto: validate

