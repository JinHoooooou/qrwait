server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Let's Encrypt 인증서 발급·갱신용 ACME 챌린지
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # SPA 라우팅 — 존재하지 않는 경로는 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/ 요청은 백엔드로 프록시
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE(Server-Sent Events) 지원
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_read_timeout 1800s;  # 백엔드 SSE 타임아웃(30분)과 맞춤
    }
}

# app.qwaiting.co.kr로 80번에 들어오면 ACME 챌린지만 예외로 허용하고 나머지는 443으로 리다이렉트
server {
    listen 80;
    server_name app.qwaiting.co.kr;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.qwaiting.co.kr;

    ssl_certificate     /etc/letsencrypt/live/app.qwaiting.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.qwaiting.co.kr/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_read_timeout 1800s;
    }
}
